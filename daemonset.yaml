apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kured-toujours
  namespace: kube-system
  labels:
    k8s-app: kured-toujours
spec:
  selector:
    matchLabels:
      name: kured-toujours
  template:
    metadata:
      labels:
        name: kured-toujours
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: kured-toujours
        # Build and load locally, or replace with your published image tag/digest.
        image: kured-toujours:local
        imagePullPolicy: IfNotPresent
        args: ["--period", "168h", "--reboot-sentinel", "/host/run/reboot-required"]
        securityContext:
          runAsUser: 0 # Required to create a marker in the root-owned host directory.
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: host-run
          mountPath: /host/run
        resources:
          limits:
            memory: 20Mi
          requests:
            cpu: 10m
            memory: 5Mi
      volumes:
      - name: host-run
        hostPath:
          path: /var/run
          type: Directory
